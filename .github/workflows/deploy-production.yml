name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d-tomates-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_URL: http://localhost

      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/database/database.sqlite

      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log

      DEPLOY_ARCHIVE: /tmp/d-tomates-public.tar.gz

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v7

      # ============================================================
      # PHP / LARAVEL
      # ============================================================

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, curl, xml, ctype, fileinfo
          tools: composer:v2
          coverage: none
        env:
          fail-fast: true

      - name: Verify PHP version
        run: |
          set -euo pipefail

          php -v
          composer --version

          PHP_VERSION_ACTUAL="$(php -r 'echo PHP_VERSION;')"

          if ! php -r 'exit(version_compare(PHP_VERSION, "8.4.1", ">=") ? 0 : 1);'; then
            echo "ERROR: PHP >= 8.4.1 required"
            echo "Current PHP: $PHP_VERSION_ACTUAL"
            exit 1
          fi

      - name: Prepare Laravel CI environment
        run: |
          set -euo pipefail

          cp .env.example .env

          mkdir -p database
          touch database/database.sqlite

      - name: Install PHP dependencies
        run: |
          set -euo pipefail

          composer install \
            --prefer-dist \
            --no-interaction \
            --no-progress \
            --optimize-autoloader

      - name: Prepare Laravel
        run: |
          set -euo pipefail

          php artisan key:generate --force
          php artisan optimize:clear
          php artisan route:clear
          php artisan wayfinder:generate --with-form

      # ============================================================
      # FRONTEND
      # ============================================================

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install frontend dependencies
        run: |
          set -euo pipefail
          npm ci

      - name: Build frontend
        run: |
          set -euo pipefail
          npm run build

      - name: Verify frontend build
        run: |
          set -euo pipefail

          test -d public/build
          test -f public/build/manifest.json

          echo "Frontend build successfully generated"
          ls -lah public/build
          ls -lah public/build/manifest.json

      # ============================================================
      # PACKAGE PUBLIC DIRECTORY
      # ============================================================

      - name: Package public assets
        run: |
          set -euo pipefail

          echo "Creating deployment archive..."

          rm -f "$DEPLOY_ARCHIVE"

          tar \
            --exclude='./index.php' \
            -czf "$DEPLOY_ARCHIVE" \
            -C public .

          if [ ! -f "$DEPLOY_ARCHIVE" ]; then
            echo "ERROR: Deployment archive was not created"
            exit 1
          fi

          echo "Deployment archive successfully created:"
          ls -lh "$DEPLOY_ARCHIVE"

          echo "Archive contents:"
          tar -tzf "$DEPLOY_ARCHIVE" | head -50

      # ============================================================
      # SSH CONFIGURATION
      # ============================================================

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTKING_SSH_KEY }}
          HOST: ${{ secrets.HOSTKING_HOST }}
          PORT: ${{ secrets.HOSTKING_PORT }}
          EXPECTED_FINGERPRINT: ${{ secrets.HOSTKING_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          echo "Retrieving Hostking SSH host key..."

          ssh-keyscan \
            -t ed25519 \
            -p "$PORT" \
            "$HOST" \
            2>/dev/null \
            > "$HOME/.ssh/known_hosts_candidate"

          if [ ! -s "$HOME/.ssh/known_hosts_candidate" ]; then
            echo "ERROR: Unable to retrieve Hostking SSH host key"
            exit 1
          fi

          ACTUAL_FINGERPRINT="$(
            ssh-keygen \
              -lf "$HOME/.ssh/known_hosts_candidate" \
              -E sha256 |
            awk '{print $2}'
          )"

          if [ -z "$EXPECTED_FINGERPRINT" ]; then
            echo "ERROR: HOSTKING_HOST_FINGERPRINT is empty"
            exit 1
          fi

          if [ "$ACTUAL_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]; then
            echo "ERROR: Hostking SSH fingerprint mismatch"
            echo "Expected: $EXPECTED_FINGERPRINT"
            echo "Received: $ACTUAL_FINGERPRINT"
            exit 1
          fi

          mv \
            "$HOME/.ssh/known_hosts_candidate" \
            "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/known_hosts"

          echo "Hostking fingerprint verified successfully"

      # ============================================================
      # SSH TEST
      # ============================================================

      - name: Test SSH connection
        env:
          HOST: ${{ secrets.HOSTKING_HOST }}
          PORT: ${{ secrets.HOSTKING_PORT }}
          USER: ${{ secrets.HOSTKING_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -p "$PORT" \
            "$USER@$HOST" \
            '
              echo "SSH connection successful"
              echo "User: $(whoami)"
              echo "Directory: $(pwd)"
            '

      # ============================================================
      # UPLOAD BUILD
      # ============================================================

      - name: Upload public assets
        env:
          HOST: ${{ secrets.HOSTKING_HOST }}
          PORT: ${{ secrets.HOSTKING_PORT }}
          USER: ${{ secrets.HOSTKING_USER }}
        run: |
          set -euo pipefail

          echo "Checking deployment archive..."

          if [ ! -f "$DEPLOY_ARCHIVE" ]; then
            echo "ERROR: $DEPLOY_ARCHIVE does not exist"
            exit 1
          fi

          ls -lh "$DEPLOY_ARCHIVE"

          echo "Uploading public assets to Hostking..."

          scp \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -P "$PORT" \
            "$DEPLOY_ARCHIVE" \
            "$USER@$HOST:/home/tctvnnfe/d-tomates-public-${GITHUB_SHA}.tar.gz"

          echo "Upload successful"

      # ============================================================
      # DEPLOY
      # ============================================================

      - name: Deploy Laravel
        env:
          HOST: ${{ secrets.HOSTKING_HOST }}
          PORT: ${{ secrets.HOSTKING_PORT }}
          USER: ${{ secrets.HOSTKING_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -p "$PORT" \
            "$USER@$HOST" \
            "DEPLOY_SHA='$GITHUB_SHA' bash -s" <<'REMOTE_SCRIPT'

          set -Eeuo pipefail

          APP_DIR="/home/tctvnnfe/d-tomates"
          PUBLIC_DIR="/home/tctvnnfe/domains/d-tomates.com/public_html"

          ARCHIVE="/home/tctvnnfe/d-tomates-public-${DEPLOY_SHA}.tar.gz"

          DEPLOY_ROOT="/home/tctvnnfe/.deploy"
          STAGING_DIR="${DEPLOY_ROOT}/d-tomates-${DEPLOY_SHA}"

          echo "======================================="
          echo "Deploying D-Tomates"
          echo "Commit: ${DEPLOY_SHA}"
          echo "======================================="

          # --------------------------------------------------------
          # CLEANUP FUNCTION
          # --------------------------------------------------------

          cleanup() {
            EXIT_CODE=$?

            echo "Running deployment cleanup..."

            rm -rf "$STAGING_DIR"
            rm -f "$ARCHIVE"

            if [ -f "$APP_DIR/artisan" ]; then
              cd "$APP_DIR"
              php artisan up >/dev/null 2>&1 || true
            fi

            exit "$EXIT_CODE"
          }

          trap cleanup EXIT

          # --------------------------------------------------------
          # VERIFY DIRECTORIES
          # --------------------------------------------------------

          test -d "$APP_DIR"
          test -d "$PUBLIC_DIR"

          cd "$APP_DIR"

          test -f .env
          test -f artisan
          test -f composer.json
          test -f "$ARCHIVE"

          mkdir -p "$DEPLOY_ROOT"

          # --------------------------------------------------------
          # UPDATE SOURCE CODE
          # --------------------------------------------------------

          echo "Updating source code..."

          git fetch --prune origin main

          git cat-file -e "${DEPLOY_SHA}^{commit}"

          git reset --hard "$DEPLOY_SHA"

          # --------------------------------------------------------
          # MAINTENANCE MODE
          # --------------------------------------------------------

          echo "Enabling maintenance mode..."

          php artisan down --retry=60 || true

          # --------------------------------------------------------
          # VERIFY PHP
          # --------------------------------------------------------

          echo "Checking PHP version..."

          php -v

          php -r '
              if (! version_compare(PHP_VERSION, "8.4.1", ">=")) {
                  fwrite(STDERR, "PHP >= 8.4.1 required\n");
                  exit(1);
              }
          '

          # --------------------------------------------------------
          # COMPOSER
          # --------------------------------------------------------

          echo "Installing production dependencies..."

          composer install \
            --no-dev \
            --prefer-dist \
            --no-interaction \
            --no-progress \
            --optimize-autoloader

          # --------------------------------------------------------
          # LARAVEL
          # --------------------------------------------------------

          echo "Clearing Laravel caches..."

          php artisan optimize:clear

          echo "Running database migrations..."

          php artisan migrate --force

          # --------------------------------------------------------
          # EXTRACT FRONTEND
          # --------------------------------------------------------

          echo "Extracting frontend package..."

          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR"

          tar \
            -xzf "$ARCHIVE" \
            -C "$STAGING_DIR"

          test -d "$STAGING_DIR/build"
          test -f "$STAGING_DIR/build/manifest.json"

          # --------------------------------------------------------
          # ATOMIC BUILD REPLACEMENT
          # --------------------------------------------------------

          NEW_BUILD="$PUBLIC_DIR/.build-${DEPLOY_SHA}"
          OLD_BUILD="$PUBLIC_DIR/.build-previous"

          rm -rf "$NEW_BUILD"
          rm -rf "$OLD_BUILD"

          echo "Preparing new Vite build..."

          mv \
            "$STAGING_DIR/build" \
            "$NEW_BUILD"

          if [ -d "$PUBLIC_DIR/build" ]; then
            echo "Backing up current build..."

            mv \
              "$PUBLIC_DIR/build" \
              "$OLD_BUILD"
          fi

          echo "Activating new build..."

          mv \
            "$NEW_BUILD" \
            "$PUBLIC_DIR/build"

          rm -rf "$OLD_BUILD"

          # --------------------------------------------------------
          # COPY OTHER PUBLIC FILES
          # --------------------------------------------------------

          echo "Synchronizing public assets..."

          cp -a \
            "$STAGING_DIR/." \
            "$PUBLIC_DIR/"

          # --------------------------------------------------------
          # LINK LARAVEL PUBLIC/BUILD
          # --------------------------------------------------------

          echo "Linking Laravel public/build..."

          rm -rf "$APP_DIR/public/build"

          ln -s \
            "$PUBLIC_DIR/build" \
            "$APP_DIR/public/build"

          # --------------------------------------------------------
          # PERMISSIONS
          # --------------------------------------------------------

          echo "Updating Laravel permissions..."

          chmod -R 775 \
            storage \
            bootstrap/cache \
            || true

          # --------------------------------------------------------
          # PRODUCTION CACHE
          # --------------------------------------------------------

          echo "Building Laravel production cache..."

          php artisan config:cache
          php artisan view:cache

          # Si toutes tes routes sont compatibles avec route:cache,
          # tu peux également activer :
          #
          # php artisan route:cache

          # --------------------------------------------------------
          # APPLICATION UP
          # --------------------------------------------------------

          echo "Disabling maintenance mode..."

          php artisan up

          # --------------------------------------------------------
          # FINAL CLEANUP
          # --------------------------------------------------------

          rm -rf "$STAGING_DIR"
          rm -f "$ARCHIVE"

          trap - EXIT

          echo
          echo "======================================="
          echo "DEPLOYMENT SUCCESSFUL"
          echo "Commit: ${DEPLOY_SHA}"
          echo "======================================="

          REMOTE_SCRIPT